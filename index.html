
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klip AI Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:Arial,sans-serif}
.app{max-width:500px;margin:auto;padding:22px}
h1{text-align:center;font-size:32px}
h1 span{color:#8b7cff}
p{text-align:center;color:#b8bfd0}
.card{background:#1c2130;border:1px solid #343b50;border-radius:18px;padding:18px;margin-top:20px}
label{display:block;margin:15px 0 8px}
textarea,select,input{width:100%;padding:13px;border-radius:10px;border:1px solid #454d63;background:#111622;color:white;font-size:16px}
textarea{height:110px;resize:vertical}
button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:12px;background:#7866ff;color:white;font-size:17px;font-weight:bold}
button:active{opacity:.8}
#preview{width:100%;margin-top:15px;border-radius:12px;display:none}
#status{white-space:pre-wrap;line-height:1.5;color:#c6cce0}
.small{font-size:13px;color:#939bb0}
</style>
</head>
<body>
<div class="app">
<h1>🎬 Klip <span>AI Video</span></h1>
<p>G‘oyangizni video loyihasiga aylantiring</p>

<div class="card">
<label>Video g‘oyasi</label>
<textarea id="prompt" placeholder="Masalan: Sher o‘rmonda yugurmoqda..."></textarea>

<label>Video davomiyligi</label>
<select id="duration">
<option value="5">5 soniya</option>
<option value="10">10 soniya</option>
<option value="30">30 soniya</option>
<option value="60">60 soniya</option>
</select>

<label>Rasm yuklash (ixtiyoriy)</label>
<input id="image" type="file" accept="image/*">
<img id="preview" alt="Yuklangan rasm">

<button id="generate">🎥 Video yaratish</button>
<div id="status">Video yaratish xizmati hali ulanmagan.</div>
<p class="small">AI video modeli serverga ulangandan keyin haqiqiy video yaratiladi.</p>
</div>
</div>
<script>
const imageInput=document.getElementById('image');
const preview=document.getElementById('preview');
imageInput.addEventListener('change',function(){
  const file=this.files[0];
  if(file){
    preview.src=URL.createObjectURL(file);
    preview.style.display='block';
  }
});
document.getElementById('generate').addEventListener('click',function(){
  const prompt=document.getElementById('prompt').value.trim();
  if(prompt.length<5){
    document.getElementById('status').textContent='Avval video g‘oyasini yozing.';
    return;
  }
  document.getElementById('status').textContent=
    'Loyiha tayyorlandi.\nVideo yaratish uchun AI serveri ulanmagan. Server ulangandan keyin bu tugma haqiqiy video yaratadi.';
});
</script>
</body>
</html>
